<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}Operations{% endblock %} · plist</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='actions.css') }}">
</head>
<body>
  <header>
    <a class="brand" href="{{ url_for('ops.dashboard_page') }}"><span>plist</span> operations</a>
    <nav>
      <a href="{{ url_for('ops.dashboard_page') }}">Dashboard</a>
      <a href="{{ url_for('ops.projects_page') }}">Projects</a>
      <a href="{{ url_for('ops.tasks_page') }}">Tasks</a>
      <a href="{{ url_for('ops.decisions_page') }}">Decisions</a>
      <a href="{{ url_for('ops.activity_page') }}">Activity</a>
    </nav>
  </header>
  <main>
    {% for category, message in get_flashed_messages(with_categories=true) %}
      <div class="flash {{ category }}">{{ message }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
